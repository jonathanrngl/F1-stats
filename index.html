<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Formel 1 Statistiken</title>
    <meta
      name="description"
      content="Weltmeisterschaftsstände der Formel 1 zu jedem Rennen seit 1950: Fahrerwertung, Konstrukteurswertung, Rennergebnisse, Qualifying und der Punkteverlauf einer Saison als Graph."
    />

    <!-- Wird vom Umschalter mitgeführt, siehe src/lib/theme.ts -->
    <meta name="theme-color" content="#f2f2f0" />

    <!-- Vorschau beim Teilen. og:url und og:image brauchen die endgueltige
         Domain und kommen erst dazu, wenn sie feststeht. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Formel 1 Statistiken" />
    <meta property="og:title" content="Formel 1 Statistiken" />
    <meta
      property="og:description"
      content="Weltmeisterschaftsstände der Formel 1 zu jedem Rennen seit 1950, samt Punkteverlauf einer ganzen Saison als Graph."
    />
    <meta name="twitter:card" content="summary" />

    <script>
      /*
       * Farbschema vor dem ersten Bild setzen, sonst blitzt bei dunklem Thema
       * kurz die helle Flaeche auf. Bewusst inline und nicht im Bundle: es muss
       * laufen, bevor der erste Pixel steht.
       *
       * Gleiche Logik wie src/lib/theme.ts – wer das eine aendert, aendert das andere.
       */
      ;(function () {
        var dark = false
        try {
          var choice = localStorage.getItem('f1theme') || 'system'
          dark =
            choice === 'dark' ||
            (choice === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        } catch (e) {
          dark = matchMedia('(prefers-color-scheme: dark)').matches
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#0a0a0a' : '#f2f2f0')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
