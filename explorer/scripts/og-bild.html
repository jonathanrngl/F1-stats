<!--
  Vorlage für public/og.png, das Vorschaubild geteilter Links (1200 × 630).
  Neu erzeugen:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \n      --window-size=1200,630 --screenshot=public/og.png scripts/og-bild.html
  Bewusst ohne Zahlen: „1.163 Rennen“ wäre nach dem nächsten Rennen falsch.
-->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:#111113;color:#f5f5f3;font-family:"Segoe UI",system-ui,sans-serif;position:relative}
.streifen{position:absolute;right:-60px;top:0;bottom:0;width:520px;display:grid;align-content:center;gap:26px;transform:skewX(-18deg)}
.streifen i{display:block;height:46px;background:#e10600;border-radius:6px;margin-left:auto}
.streifen i:nth-child(1){width:520px}.streifen i:nth-child(2){width:410px;opacity:.85}.streifen i:nth-child(3){width:300px;opacity:.7}
.inhalt{position:absolute;left:80px;top:96px;width:640px}
.ober{font-size:26px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#ff2b1f}
h1{margin:14px 0 0;font-size:92px;line-height:1;font-weight:850;letter-spacing:-.03em}
p{margin:34px 0 0;font-size:34px;line-height:1.35;color:#cfcec6}
.fuss{position:absolute;left:80px;bottom:64px;font-size:24px;color:#a9a8a2;letter-spacing:.02em}
.linie{position:absolute;left:0;right:0;bottom:0;height:10px;background:#e10600}
</style></head><body>
<div class="streifen"><i></i><i></i><i></i></div>
<div class="inhalt"><div class="ober">Formula 1</div><h1>Statistics</h1>
<p>Every season since 1950, in numbers: results, records, head-to-heads.</p></div>
<div class="fuss">Worked out from the race results themselves · Data: F1DB, CC BY 4.0</div>
<div class="linie"></div>
</body></html>
