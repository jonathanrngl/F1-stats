# Baut beide Anwendungen bei jedem Push auf main und veroeffentlicht sie
# gemeinsam auf GitHub Pages:
#
#   /F1-stats/            der Explorer (Astro, aus der importierten Datenbank)
#   /F1-stats/classic/    die bisherige React-Anwendung
name: Deploy

on:
  push:
    branches: [main]
  # Die Rennvorschau zeigt das naechste Rennen und den Stand der WM. Beides
  # veraltet ohne Neubau, denn die Seite ist statisch. Einmal taeglich reicht:
  # Das F1DB-Release kommt nach jedem Rennwochenende, nicht haeufiger.
  #
  # Der Lauf holt bewusst das neueste Release, damit die Seite von selbst
  # stimmt. Der Import prueft es gegen die Pruefsummendatei des Releases und
  # jede Kennung darin, bevor daraus Adressen werden - siehe scripts/import.mjs.
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

# Voreinstellung fuer jeden Job: nur lesen. Die Rechte zum Veroeffentlichen
# bekommt allein der deploy-Job weiter unten.
#
# Der Grund steht im build-Job: Der fuehrt fremden Code aus - die Lebenszyklus-
# Skripte der Abhaengigkeiten und alles, was vite und astro beim Bauen tun. Ein
# Job, der fremden Code ausfuehrt, soll nichts veroeffentlichen und kein
# OIDC-Token praegen koennen.
permissions:
  contents: read

# Ein Deploy zur Zeit; laufende werden nicht abgebrochen, damit keine halb
# veroeffentlichte Seite stehen bleibt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node:sqlite braucht Node 22 oder neuer - der Import und die
      # Statistik-Engine benutzen es ohne native Abhaengigkeit.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # ------------------------------------------------ klassische Anwendung
      #
      # --ignore-scripts: Ein Paket darf beim Installieren keinen eigenen Code
      # ausfuehren. Beide Anwendungen bauen ohne solche Skripte - nachgemessen,
      # nicht vermutet. Es ist kein vollstaendiger Schutz, denn vite und astro
      # fuehren beim Bauen ohnehin Paketcode aus; es nimmt aber den bequemsten
      # Weg weg, auf dem eine untergeschobene Abhaengigkeit zuschlaegt.
      - name: Klassische Anwendung bauen
        run: |
          npm ci --ignore-scripts
          npm run lint
          npm run build

      # ------------------------------------------------------------ Explorer
      - name: Explorer-Abhaengigkeiten
        working-directory: explorer
        run: npm ci --ignore-scripts

      # Die Datenbank ist nicht eingecheckt; sie entsteht aus dem neuesten
      # F1DB-Release, geprueft gegen dessen Pruefsummendatei. Der Import
      # schreibt nichts, wenn eine Pruefung fehlschlaegt.
      - name: Datenbank importieren
        working-directory: explorer
        run: npm run import

      # 89 Pruefungen gegen die importierte Datenbank. Lieber kein Deploy als
      # einer mit falschen Zahlen.
      - name: Statistik-Engine pruefen
        working-directory: explorer
        run: npm test

      - name: Explorer bauen
        working-directory: explorer
        run: npm run build

      # --------------------------------------------------- zusammenlegen
      - name: Seite zusammenlegen
        run: |
          mkdir -p site
          cp -r explorer/dist/. site/
          mkdir -p site/classic
          cp -r dist/. site/classic/
          # Astro legt seine Bundles nach _astro/. Der Pages-Deploy laeuft ohne
          # Jekyll, das Verzeichnisse mit Unterstrich verschluckt - die Datei
          # stellt das auch dann sicher, wenn sich das einmal aendert.
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Nur dieser Job darf veroeffentlichen. Er fuehrt keinen fremden Code aus,
    # sondern nimmt allein das fertige Artefakt des build-Jobs entgegen.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
